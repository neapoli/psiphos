psiphos.settings:
  path: '/admin/config/psiphos'
  defaults:
    _form: '\Drupal\psiphos\Form\SettingsForm'
    _title: 'Psíphos — sedute collegiali a distanza'
  requirements:
    _permission: 'administer psiphos'

# La rotta è generata dal tipo di entità e chiede «administer psiphos». Qui si
# allarga: chi convoca deve vedere le proprie sedute, e dirigente e segreteria
# tutte. Quali righe compaiano lo decide poi il controllo di accesso sulle
# singole sedute, non questo permesso.
entity.psiphos_seduta.collection:
  path: '/admin/content/psiphos/seduta'
  defaults:
    _entity_list: 'psiphos_seduta'
    _title: 'Sedute collegiali'
  requirements:
    _permission: 'administer psiphos+psiphos convocare seduta+psiphos visualizzare ogni verbale'

psiphos.archivio_sedute:
  path: '/psiphos/le-mie-sedute'
  defaults:
    _controller: '\Drupal\psiphos\Controller\ArchivioSeduteController::elenco'
    _title: 'Le mie sedute collegiali'
  options:
    no_cache: TRUE
  requirements:
    # Uno qualunque basta: chi partecipa, chi presiede, chi verbalizza, chi
    # consulta i verbali. Quali sedute si vedano lo decide poi l'elenco degli
    # aventi diritto, non il permesso.
    _permission: 'psiphos partecipare seduta+psiphos presiedere seduta+psiphos verbalizzare+psiphos visualizzare verbali+psiphos visualizzare ogni verbale'

psiphos.aula:
  path: '/psiphos/seduta/{psiphos_seduta}/aula'
  defaults:
    _controller: '\Drupal\psiphos\Controller\AulaController::aula'
    _title_callback: '\Drupal\psiphos\Controller\AulaController::titolo'
  options:
    parameters:
      psiphos_seduta:
        type: 'entity:psiphos_seduta'
    no_cache: TRUE
  requirements:
    _permission: 'psiphos partecipare seduta+psiphos presiedere seduta+administer psiphos'
    _entity_access: 'psiphos_seduta.view'

psiphos.aula.contenuto:
  path: '/psiphos/seduta/{psiphos_seduta}/aula/contenuto'
  defaults:
    _controller: '\Drupal\psiphos\Controller\AulaController::contenuto'
  options:
    parameters:
      psiphos_seduta:
        type: 'entity:psiphos_seduta'
    no_cache: TRUE
  requirements:
    _permission: 'psiphos partecipare seduta+psiphos presiedere seduta+administer psiphos'
    _entity_access: 'psiphos_seduta.view'

psiphos.aula.stato:
  path: '/psiphos/seduta/{psiphos_seduta}/aula/stato'
  defaults:
    _controller: '\Drupal\psiphos\Controller\AulaController::stato'
